name: Target change proposal
description: Prepare a decision-ready proposal for changing the published standard in bukovskyjosef/agenti.
title: "[PROPOSAL] "
body:
  - type: dropdown
    id: status
    attributes:
      label: Proposal status
      options:
        - DRAFT
        - READY_FOR_CRITIQUE
        - AWAITING_HUMAN
        - APPROVED_FOR_PUBLICATION
        - ITERATE
        - REJECT
    validations:
      required: true

  - type: textarea
    id: concurrency
    attributes:
      label: Concurrency
      description: "Keep SERIAL unless K has freshly authorized this work item pair and durably updated both Issues to PARALLEL-SAFE with #N. A/E/R/P must not self-authorize parallelism."
      value: "SERIAL"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem in the current target model
      description: Describe the problem and point to the exact current agenti/main rule/ref being evaluated.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Summarize durable evidence and link investigations, real-project observations or experiments.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Material options
      description: Usually 2–3 materially different options, including keeping the current model when relevant, with consequences/trade-offs.
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: Optional. Keep it distinct from the Human/Product Owner decision.

  - type: textarea
    id: target_impact
    attributes:
      label: Expected published-target impact
      description: Which rule families/files in agenti/main would change if approved? This is impact analysis, not publication authority.
    validations:
      required: true

  - type: textarea
    id: critique
    attributes:
      label: Independent critique / review
      description: Link or summarize independent critique. Proposal author must not present self-review as independent review.

  - type: textarea
    id: human
    attributes:
      label: Human decision
      description: Record explicit REJECT / ITERATE / APPROVE_FOR_PUBLICATION and exact conditions. Leave unresolved until Human/Product Owner decides.

  - type: textarea
    id: publication
    attributes:
      label: Publication handoff
      description: After approval, record final reviewed lab artifact/branch and, after publish, the resulting agenti/main commit SHA.

  - type: checkboxes
    id: boundary
    attributes:
      label: Authority boundary
      options:
        - label: This proposal is not the current published target specification.
          required: true
        - label: Approval authorizes preparation/publication of the reviewed target; it does not create a development Issue or PR in bukovskyjosef/agenti.
          required: true