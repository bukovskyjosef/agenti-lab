name: Investigation / audit
description: Investigate evidence, a workflow problem, adoption experience or hypothesis without changing the published target.
title: "[INVESTIGATION] "
body:
  - type: textarea
    id: question
    attributes:
      label: Question / observed problem
      description: What are we trying to learn, verify or falsify?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What workflow quality, cost, reliability or adoption concern motivates this investigation?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence sources
      description: Link exact agenti/main refs, real-project issues/PRs, experiments or other durable evidence. Do not copy the full target standard.
      placeholder: |
        - bukovskyjosef/agenti@main: ...
        - FamilyHelper/Kvazi/...: ...
    validations:
      required: true

  - type: textarea
    id: limits
    attributes:
      label: Known limits / uncertainty
      description: What can the available evidence not prove yet?

  - type: dropdown
    id: mode
    attributes:
      label: Responsible lab mode
      options:
        - Investigator / Analyst
        - Reviewer / Critic
        - Asistentka
        - Developer / Editor
        - Publisher
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Define what would count as a useful conclusion or decision-ready result.
    validations:
      required: true

  - type: checkboxes
    id: boundary
    attributes:
      label: Repository boundary check
      options:
        - label: This issue does not itself change the current published target in bukovskyjosef/agenti.
          required: true
        - label: If a target change is recommended, Human decision and any implementation/review will stay in agenti-lab until a clean target is published to agenti/main.
          required: true