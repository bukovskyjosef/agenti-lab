name: Issue 29 temporary core self-test

on:
  push:
    branches:
      - issue-29/cost-capacity-interface

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Assemble Child 1 plus Child 5 core overlay
        run: |
          rm -rf /tmp/reference
          cp -R proposals/issue-21/target/reference /tmp/reference
          cp -R proposals/issue-29/target/reference/. /tmp/reference/
      - name: Syntax
        run: find /tmp/reference/core -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Legacy core tests
        working-directory: /tmp/reference
        run: npm test
      - name: Doctor legacy profile
        working-directory: /tmp/reference
        run: npm run doctor -- ./conformance/fixtures/project-profile.valid.json
