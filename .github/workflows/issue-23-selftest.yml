name: Issue 23 temporary fresh-adoption self-test

on:
  push:
    branches:
      - issue-23/multi-repo-o-adapter

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify fresh-adoption delta scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only 4ce8eadd0f33043491bbca0297ef4b6f70752f73..HEAD | grep -v '^proposals/issue-23/target/reference/app/multi-repo-o/src/orchestrator.mjs$' | grep -v '^proposals/issue-23/target/reference/app/multi-repo-o/test/corrective.e2e.test.mjs$' | grep -v '^.github/workflows/issue-23-selftest.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected fresh-adoption delta:"
            echo "$unexpected"
            exit 1
          fi
      - name: Syntax check
        shell: bash
        run: |
          find proposals/issue-23/target/reference/app/multi-repo-o/src                proposals/issue-23/target/reference/app/multi-repo-o/bin                proposals/issue-23/target/reference/app/multi-repo-o/test                -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Tests
        working-directory: proposals/issue-23/target/reference/app/multi-repo-o
        run: npm test
      - name: Docker build
        run: docker build -f proposals/issue-23/target/reference/app/multi-repo-o/Dockerfile .
