name: Issue 23 temporary self-test

on:
  push:
    branches:
      - issue-23/multi-repo-o-adapter

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify bounded delta
        shell: bash
        run: |
          unexpected="$(git diff --name-only 7b155f8abd09f84c0065d64063eee3b2c3dce615..HEAD | grep -v '^proposals/issue-23/' | grep -v '^.github/workflows/issue-23-selftest.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Child 3 delta:"
            echo "$unexpected"
            exit 1
          fi
      - name: Syntax check
        shell: bash
        run: |
          find proposals/issue-23/target/reference/app/multi-repo-o/src                proposals/issue-23/target/reference/app/multi-repo-o/bin                proposals/issue-23/target/reference/app/multi-repo-o/test                -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Tests
        working-directory: proposals/issue-23/target/reference/app/multi-repo-o
        run: npm test
      - name: Docker build
        run: docker build -f proposals/issue-23/target/reference/app/multi-repo-o/Dockerfile .
