name: issue-31 corrective validation

on:
  pull_request:
    branches:
      - main
      - issue-29/cost-capacity-interface
    paths:
      - "proposals/issue-31/**"
      - ".github/workflows/issue-31-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Exact Child 6 corrective validation
        run: node proposals/issue-31/assemble-and-validate.mjs --docker
