name: temporary / issue22 validation

on:
  push:
    branches:
      - issue-22/single-repo-actions-starter
  pull_request:
    branches:
      - issue-21/core-protocol-o-engine
    paths:
      - "proposals/issue-21/**"
      - "proposals/issue-22/**"
      - ".github/workflows/issue22-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runtime
        run: node --version
      - name: Assemble approved Child 1 plus Child 2 and validate
        run: node proposals/issue-22/assemble-and-validate.mjs


  provider_a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY unavailable; A provider smoke skipped"
          fi
      - if: steps.secret.outputs.available == 'true'
        name: Prepare A smoke context
        run: |
          mkdir -p .agenti-run .agenti
          cp proposals/issue-22/target/reference/profiles/single-repo-actions/target/.agenti/project-profile.json .agenti/project-profile.json
          cat > .agenti-run/assignment.json <<'JSON'
          {"schema_version":1,"assignment_id":"asg-provider-smoke-a","issued_at":"2026-09-18T12:00:00Z","role":"A","purpose":"PROVIDER_SMOKE","work_item":{"control_repository":"bukovskyjosef/agenti-lab","issue_number":22},"execution_repository":{"repository":"bukovskyjosef/agenti-lab"},"state":{"version":1,"fingerprint":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","contract_digest":"sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},"candidate":{"kind":"none","digest":null,"members":[]},"context_entrypoints":[{"kind":"work_item","ref":"bukovskyjosef/agenti-lab#22"}],"capability_profile":"A_READ_ANALYZE","independence":{"required":false,"must_differ_from_execution_instances":[],"enforcement_mechanism":"none"},"completion":{"result_schema_version":1,"result_marker":"agenti-role-result:v1","callback_event":"agenti.role-result"}}
          JSON
          cat > .agenti-run/work-item.md <<'EOF'
          ## Goal
          Provider smoke only: confirm A can return a schema-valid READY proposal without changing repository state.
          ## Scope
          No repository changes.
          ## Acceptance criteria
          Return READY with no contract operations.
          EOF
      - if: steps.secret.outputs.available == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: proposals/issue-22/target/reference/profiles/single-repo-actions/target/.agenti/prompts/A.md
          output-schema-file: proposals/issue-22/target/reference/adapters/codex-action/schemas/analyst-proposal.schema.json
          output-file: /tmp/agenti-a-smoke.json
          allow-bots: "true"
      - if: steps.secret.outputs.available == 'true'
        run: |
          node -e 'const x=require("/tmp/agenti-a-smoke.json"); if(x.role!=="A"||x.result_type!=="ANALYST") process.exit(1)'
          echo "PROVIDER_SMOKE_A=PASS"

  provider_d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY unavailable; D provider smoke skipped"
          fi
      - if: steps.secret.outputs.available == 'true'
        name: Prepare D smoke context
        run: |
          mkdir -p .agenti-run .agenti
          cp proposals/issue-22/target/reference/profiles/single-repo-actions/target/.agenti/project-profile.json .agenti/project-profile.json
          cat > .agenti-run/assignment.json <<'JSON'
          {"schema_version":1,"assignment_id":"asg-provider-smoke-d","issued_at":"2026-09-18T12:00:00Z","role":"D","purpose":"PROVIDER_SMOKE","work_item":{"control_repository":"bukovskyjosef/agenti-lab","issue_number":22},"execution_repository":{"repository":"bukovskyjosef/agenti-lab","ref":"issue-22/single-repo-actions-starter"},"state":{"version":1,"fingerprint":"sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","contract_digest":"sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"},"candidate":{"kind":"none","digest":null,"members":[]},"context_entrypoints":[{"kind":"work_item","ref":"bukovskyjosef/agenti-lab#22"}],"capability_profile":"D_WORKSPACE_WRITE","independence":{"required":false,"must_differ_from_execution_instances":[],"enforcement_mechanism":"none"},"completion":{"result_schema_version":1,"result_marker":"agenti-role-result:v1","callback_event":"agenti.role-result"}}
          JSON
          cat > .agenti-run/work-item.md <<'EOF'
          ## Goal
          Provider smoke only: create provider-smoke-d.txt containing exactly: provider smoke ok
          ## Scope
          Only provider-smoke-d.txt in the ephemeral runner workspace.
          ## Acceptance criteria
          File exists with exactly one line: provider smoke ok
          EOF
      - if: steps.secret.outputs.available == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: proposals/issue-22/target/reference/profiles/single-repo-actions/target/.agenti/prompts/D.md
          output-schema-file: proposals/issue-22/target/reference/adapters/codex-action/schemas/developer-proposal.schema.json
          output-file: /tmp/agenti-d-smoke.json
          allow-bots: "true"
      - if: steps.secret.outputs.available == 'true'
        run: |
          node -e 'const x=require("/tmp/agenti-d-smoke.json"); if(x.role!=="D"||x.result_type!=="DEVELOPER") process.exit(1)'
          test "$(cat provider-smoke-d.txt)" = "provider smoke ok"
          echo "PROVIDER_SMOKE_D=PASS"

  provider_r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY unavailable; R provider smoke skipped"
          fi
      - if: steps.secret.outputs.available == 'true'
        name: Prepare R smoke context
        run: |
          mkdir -p .agenti-run .agenti
          cp proposals/issue-22/target/reference/profiles/single-repo-actions/target/.agenti/project-profile.json .agenti/project-profile.json
          cat > .agenti-run/assignment.json <<'JSON'
          {"schema_version":1,"assignment_id":"asg-provider-smoke-r","issued_at":"2026-09-18T12:00:00Z","role":"R","purpose":"PROVIDER_SMOKE","work_item":{"control_repository":"bukovskyjosef/agenti-lab","issue_number":22},"execution_repository":{"repository":"bukovskyjosef/agenti-lab","ref":"issue-22/single-repo-actions-starter"},"state":{"version":1,"fingerprint":"sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee","contract_digest":"sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"},"candidate":{"kind":"single","digest":"sha256:1111111111111111111111111111111111111111111111111111111111111111","members":[{"repository":"bukovskyjosef/agenti-lab","pr_number":27,"head_sha":"b069199e6804f34dec79ca164626dd990e911dc7","base_ref_or_sha":"7b155f8abd09f84c0065d64063eee3b2c3dce615"}]},"context_entrypoints":[{"kind":"work_item","ref":"bukovskyjosef/agenti-lab#22"}],"capability_profile":"R_READ_REVIEW","independence":{"required":true,"must_differ_from_execution_instances":["exec-provider-smoke-d"],"enforcement_mechanism":"codex-fresh-actions-run"},"completion":{"result_schema_version":1,"result_marker":"agenti-role-result:v1","callback_event":"agenti.role-result"}}
          JSON
          cat > .agenti-run/work-item.md <<'EOF'
          ## Goal
          Provider smoke only: review the current checked-out Child 2 target for obvious blocking defects.
          ## Scope
          Read-only provider invocation smoke.
          ## Acceptance criteria
          Return one canonical R outcome with schema-valid fields.
          EOF
      - if: steps.secret.outputs.available == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: proposals/issue-22/target/reference/profiles/single-repo-actions/target/.agenti/prompts/R.md
          output-schema-file: proposals/issue-22/target/reference/adapters/codex-action/schemas/reviewer-proposal.schema.json
          output-file: /tmp/agenti-r-smoke.json
          allow-bots: "true"
      - if: steps.secret.outputs.available == 'true'
        run: |
          node -e 'const x=require("/tmp/agenti-r-smoke.json"); if(x.role!=="R"||x.result_type!=="REVIEWER") process.exit(1)'
          echo "PROVIDER_SMOKE_R=PASS"
