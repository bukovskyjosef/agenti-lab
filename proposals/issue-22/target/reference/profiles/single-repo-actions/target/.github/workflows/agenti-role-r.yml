name: agenti / R

on:
  workflow_dispatch:
    inputs:
      issue_number: { required: true, type: string }
      assignment_id: { required: true, type: string }

concurrency:
  group: agenti-role-${{ inputs.assignment_id }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      candidate_ref: ${{ steps.prepare.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agenti-runtime/runtime/runner.mjs prepare R "${{ inputs.issue_number }}" "${{ inputs.assignment_id }}" "$RUNNER_TEMP/agenti-run"
      - if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agenti-context-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
          if-no-files-found: error

  model:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: agenti-context-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
      - uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets[vars.AGENTI_CODEX_SECRET_NAME] }}
          permission-profile: ":read-only"
          prompt-file: .agenti/prompts/R.md
          output-schema-file: .agenti-runtime/adapters/codex-action/schemas/reviewer-proposal.schema.json
          output-file: ${{ runner.temp }}/agenti-run/proposal.json
          allow-bots: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: agenti-r-output-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
          if-no-files-found: error

  finalize:
    needs: [preflight, model]
    if: needs.preflight.outputs.skip != 'true' && needs.model.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: agenti-r-output-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .agenti-runtime/runtime/runner.mjs finalize R "${{ inputs.issue_number }}" "${{ inputs.assignment_id }}" "$RUNNER_TEMP/agenti-run/proposal.json"
