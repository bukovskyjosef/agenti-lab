name: agenti / D

on:
  workflow_dispatch:
    inputs:
      issue_number: { required: true, type: string }
      assignment_id: { required: true, type: string }

concurrency:
  group: agenti-role-${{ inputs.assignment_id }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      candidate_ref: ${{ steps.prepare.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agenti-runtime/runtime/runner.mjs prepare D "${{ inputs.issue_number }}" "${{ inputs.assignment_id }}" "$RUNNER_TEMP/agenti-run"
      - if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agenti-context-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
          if-no-files-found: error

  model:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.candidate_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: agenti-context-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
      - name: Explicit test-only fake D runner
        if: vars.AGENTI_TEST_MODE == 'true'
        env:
          AGENTI_TEST_MODE: "true"
        run: node .agenti-runtime/runtime/fake-runner.mjs D "$RUNNER_TEMP/agenti-run" "$RUNNER_TEMP/agenti-run/proposal.json"
      - if: vars.AGENTI_TEST_MODE != 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .agenti/prompts/D.md
          output-schema-file: .agenti-runtime/adapters/codex-action/schemas/developer-proposal.schema.json
          output-file: ${{ runner.temp }}/agenti-run/proposal.json
          allow-bots: "true"
      - name: Capture deterministic workspace diff
        run: |
          git add -N .
          git diff --binary > "$RUNNER_TEMP/agenti-run/change.diff"
          git reset
          test -s "$RUNNER_TEMP/agenti-run/change.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agenti-d-output-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
          if-no-files-found: error

  candidate_writer:
    needs: [preflight, model]
    if: needs.preflight.outputs.skip != 'true' && needs.model.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: agenti-d-output-${{ inputs.assignment_id }}
          path: ${{ runner.temp }}/agenti-run
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node .agenti-runtime/runtime/candidate-writer.mjs             "${{ inputs.issue_number }}"             "${{ inputs.assignment_id }}"             "$RUNNER_TEMP/agenti-run/proposal.json"             "$RUNNER_TEMP/agenti-run/run-context.json"             "$RUNNER_TEMP/agenti-run/change.diff"
