name: agenti / O orchestrate

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Managed issue number; empty means reconcile all
        required: false
        type: string
      wake_kind:
        description: Non-authoritative wake reason
        required: false
        type: string
      assignment_id:
        description: Optional callback assignment id
        required: false
        type: string
      result_ref:
        description: Optional callback result reference
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  actions: write

concurrency:
  group: agenti-o-${{ github.repository }}-${{ inputs.issue_number || github.event.issue.number || 'reconcile-all' }}
  cancel-in-progress: false
  queue: max

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Fresh reconstruct and evaluate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AGENTI_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number || '' }}
        run: |
          if [ -n "$AGENTI_ISSUE_NUMBER" ]; then
            node .agenti-runtime/runtime/orchestrate.mjs "$AGENTI_ISSUE_NUMBER"
          else
            node .agenti-runtime/runtime/orchestrate.mjs --all
          fi
