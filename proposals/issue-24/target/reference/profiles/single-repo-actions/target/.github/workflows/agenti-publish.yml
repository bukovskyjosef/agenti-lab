name: agenti / P publish

on:
  workflow_dispatch:
    inputs:
      issue_number: { required: true, type: string }
      assignment_id: { required: true, type: string }

env:
  AGENTI_REQUIRE_ASSIGNMENT_TRUST: "true"

concurrency:
  group: agenti-role-${{ inputs.assignment_id }}
  cancel-in-progress: false

jobs:
  publish:
    concurrency:
      group: agenti-state-${{ github.repository_id }}-${{ inputs.issue_number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Trusted T0 bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agenti-bootstrap/bootstrap-trust.mjs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node $RUNNER_TEMP/agenti-control/reference/profiles/single-repo-actions/runtime/runner.mjs prepare P "${{ inputs.issue_number }}" "${{ inputs.assignment_id }}" "$RUNNER_TEMP/agenti-run"
      - if: steps.prepare.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node $RUNNER_TEMP/agenti-control/reference/profiles/single-repo-actions/runtime/publish.mjs "${{ inputs.issue_number }}" "${{ inputs.assignment_id }}" "$RUNNER_TEMP/agenti-run/run-context.json"
